# Cloudflare Worker configuration (spec §12). Contains NO secrets — all secret
# material is injected by CI via `wrangler secret put` (see docs/SECRETS.md).
#
# The production `name`, route/custom-domain, and the non-secret config vars
# (RP_ID, RP_ORIGIN, VAPID_PUBLIC_KEY) are supplied by CI at deploy time so the
# same file serves production and every per-PR preview unchanged.

name = "okr-tracker"
main = "build/worker/shim.mjs"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# `worker-build` compiles crates/worker to wasm + JS shim; the frontend is
# built by trunk into ./dist. See scripts/build.sh.
[build]
command = "bash scripts/build.sh"

# Static, content-hashed SPA assets. The runtime serves these directly and
# falls back to index.html for client-side routes (§10.4). The Worker only runs
# for /api/* (no matching asset) and for the SPA fallback.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# The single Org Durable Object — source of truth, SQLite backend (§3.1/§3.3).
[[durable_objects.bindings]]
name = "ORG"
class_name = "Org"

# SQLite-backed Durable Object class (the SQLite storage backend is required).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Org"]

[observability]
enabled = true
