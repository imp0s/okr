name: Deploy Production

# Spec §13.2 — on merge to main, deploy production using Workers versioned
# deployments. We upload a new immutable version and then promote it; rollback
# is re-promoting the previous version (see docs/RUNBOOK.md).
on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & promote production version
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.RP_ORIGIN }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.103.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install build tooling
        run: |
          cargo install worker-build --locked || true
          cargo install trunk --version 0.21.7 --locked || true

      # Secrets persist across versions; setting them is idempotent and ensures
      # the deployment is always correctly configured.
      - name: Ensure Worker secrets
        env:
          SETUP_SECRET: ${{ secrets.SETUP_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          put() { echo -n "$2" | $WRANGLER secret put "$1"; }
          put SETUP_SECRET      "$SETUP_SECRET"
          put VAPID_PRIVATE_KEY "$VAPID_PRIVATE_KEY"

      # Upload a new version carrying the non-secret config as bundled vars,
      # then promote it. `wrangler deploy` creates + activates a version
      # atomically; `wrangler rollback` re-promotes the prior one (§16).
      - name: Deploy
        run: |
          set -euo pipefail
          $WRANGLER deploy \
            --var RP_ID:"${{ vars.RP_ID }}" \
            --var RP_ORIGIN:"${{ vars.RP_ORIGIN }}" \
            --var VAPID_PUBLIC_KEY:"${{ vars.VAPID_PUBLIC_KEY }}"

      # OPTIONAL GRADUAL ROLLOUT (spec §13.2). Disabled by default because it
      # requires Workers paid plans and careful version-id handling. To enable,
      # replace the step above with:
      #   $WRANGLER versions upload --var RP_ID:... --var RP_ORIGIN:... --var VAPID_PUBLIC_KEY:...
      #   $WRANGLER versions deploy --yes   # interactive percentages, or:
      #   $WRANGLER versions deploy <NEW_VERSION_ID>@10 <PREV_VERSION_ID>@90 --yes
      # then a follow-up job promotes <NEW_VERSION_ID>@100 after soak. See RUNBOOK.
