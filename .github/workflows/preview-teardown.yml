name: Preview Teardown

# Spec §13.1.3 — on PR close (merged or not), delete the preview Worker and its
# Durable Object namespace/data so nothing lingers and no cost accrues.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  destroy-preview:
    name: Destroy PR preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.103.0
    steps:
      - uses: actions/checkout@v4

      - name: Delete preview Worker (and its DO storage)
        run: |
          NAME="okr-pr-${{ github.event.number }}"
          # --force deletes the script even though it owns a Durable Object with
          # stored data; this discards the preview's independent datastore.
          $WRANGLER delete --name "$NAME" --force || \
            echo "Preview $NAME already absent — nothing to delete."

      - name: Update PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            ### 🧹 Preview torn down

            The preview Worker `okr-pr-${{ github.event.number }}` and its
            datastore have been deleted.
