# cargo-deny configuration (spec §11 / §13.1). Run in CI: `cargo deny check`.
[advisories]
version = 2
yanked = "deny"
# Unmaintained transitive build-macro deps pulled in only by the Leptos
# proc-macro tree. No safe upgrade exists yet (they are not vulnerabilities,
# just archived crates); revisit when Leptos updates its macro dependencies.
ignore = [
  "RUSTSEC-2026-0173", # proc-macro-error2 unmaintained (via leptos_macro)
  "RUSTSEC-2024-0436", # paste unmaintained (via leptos/tachys)
]

[licenses]
version = 2
# Permissive licenses acceptable for this project's dependency tree.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"   # no wildcard version requirements (§2 pinning)
allow-wildcard-paths = true   # ...except internal workspace `path` deps

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
